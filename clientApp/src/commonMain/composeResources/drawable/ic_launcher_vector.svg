        x="256"
        y="256" />

    <!-- Intertwined Loop/Block: Electric Blue -->
    <rect
        fill="none"
        height="400"
        rx="100"
        stroke="#00E5FF"
        stroke-width="120"
        width="400"
        x="368"
        y="368" />
</svg>
